<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- White background -->
  <rect width="512" height="512" fill="white"/>
  
  <!-- House shape with rounded corners -->
  <path d="M 256 80 
           L 100 180 
           L 100 380 
           L 180 432 
           L 332 432 
           L 412 380 
           L 412 180 
           Z" 
        fill="url(#houseGradient)" 
        stroke="none"/>
  
  <!-- Window grid (4 panes) -->
  <rect x="210" y="210" width="35" height="35" fill="white" rx="2"/>
  <rect x="267" y="210" width="35" height="35" fill="white" rx="2"/>
  <rect x="210" y="267" width="35" height="35" fill="white" rx="2"/>
  <rect x="267" y="267" width="35" height="35" fill="white" rx="2"/>
  
  <!-- Checkmark -->
  <path d="M 140 340 L 190 390 L 280 300" 
        stroke="#22c55e" 
        stroke-width="20" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        fill="none"/>
  
  <!-- Gradient definition -->
  <defs>
    <linearGradient id="houseGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>
  </defs>
</svg>